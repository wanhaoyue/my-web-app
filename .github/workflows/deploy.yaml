name: CI/CD - Test, Build, Deploy to ECS

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "**.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never run two deployments at the same time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# These names match the defaults in terraform/main.tf (var.app_name)
env:
  AWS_REGION: ap-southeast-5
  ECR_REPOSITORY: my-web-app
  ECS_CLUSTER: my-web-app
  ECS_SERVICE: my-web-app
  TASK_FAMILY: my-web-app
  CONTAINER_NAME: my-web-app

jobs:
  # ---------- CI: runs on every push and pull request ----------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Verify Docker image builds
        run: docker build -t my-web-app:ci .

  # ---------- CD: runs only on pushes to main, after tests pass ----------
  deploy:
    name: Build, Push and Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Take the current task definition from ECS, swap in the new image
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Render new task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          environment-variables: |
            APP_VERSION=${{ github.sha }}

      # Registers a new revision, updates the service, waits until stable.
      # The circuit breaker in Terraform rolls back automatically on failure.
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      # Confirm the new version is really live
      - name: Smoke test
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
            --desired-status RUNNING --query 'taskArns[0]' --output text)

          ENI=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)

          IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)

          echo "Task public IP: $IP"

          RESPONSE=$(curl -fsS --retry 10 --retry-delay 5 --retry-connrefused \
            "http://$IP:5000/health")
          echo "$RESPONSE"

          DEPLOYED=$(echo "$RESPONSE" | jq -r '.version')
          if [ "$DEPLOYED" != "${{ github.sha }}" ]; then
            echo "Version mismatch: expected ${{ github.sha }}, got $DEPLOYED"
            exit 1
          fi

          echo "### Deployed ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "App URL: http://$IP:5000" >> "$GITHUB_STEP_SUMMARY"